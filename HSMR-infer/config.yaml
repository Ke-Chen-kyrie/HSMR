# HSMR 推理服务配置
# 模型路径相对工程根解析 (不依赖 CWD); 权重已自包含于 data_inputs/.

model:
  device: "cuda:0"              # detector + SKEL 设备
  onnx_device: "cuda:0"         # ONNX Runtime 设备 (可单独设)
  onnx_model: "deploy/onnx/artifacts/hsmr_full_fp16.onnx"
  model_root: "data_inputs/released_models/HSMR-ViTH-r1d1"

detector:
  max_img_size: 512
  use_amp: true                 # FP16 加速检测器 (~3倍快)

max_instances: 5                # 每帧最多检测人数

server:
  host: "0.0.0.0"
  port: 8010
